<ion-content class="ion-padding">

  <div class="header">
    <img src="assets/midr-logo.png" class="logo" />
    <h2>Iniciar sesión</h2>
    <p>Bienvenido de vuelta 💜</p>
  </div>

  <ion-list lines="none">

    <ion-item>
      <ion-input
        label="Correo"
        labelPlacement="floating"
        type="email"
        [(ngModel)]="email">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        label="Contraseña"
        labelPlacement="floating"
        type="password"
        [(ngModel)]="password">
      </ion-input>
    </ion-item>

  </ion-list>

  <ion-button
    expand="block"
    shape="round"
    size="large"
    (click)="login()"
    class="btn-login">
    Entrar
  </ion-button>

</ion-content>
